name: Product CD Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-and-push:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/productdb
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Check Product API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health; then
              echo ""
              echo "Product API is healthy"
              exit 0
            fi

            echo "Waiting for Product API..."
            sleep 2
          done

          echo "Product API healthcheck failed"
          cat server.log
          exit 1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}

      - name: Docker Hub push completed
        run: echo "Docker image pushed successfully"

  deploy-local:
    needs: ci-and-push
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull latest Docker images
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Deploy to local Docker Engine
        run: docker compose -f docker-compose-prod.yaml up -d --force-recreate

      - name: Wait for local Product API healthcheck
        shell: powershell
        run: |
          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:3000/health" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                Write-Host "Product API is healthy"
                Write-Host $response.Content
                exit 0
              }
            }
            catch {
              Write-Host "Waiting for Product API..."
            }

            Start-Sleep -Seconds 2
          }

          Write-Host "Product API failed healthcheck"
          docker compose -f docker-compose-prod.yaml ps
          docker compose -f docker-compose-prod.yaml logs product-api
          exit 1

      - name: Show deployed containers
        run: docker compose -f docker-compose-prod.yaml ps