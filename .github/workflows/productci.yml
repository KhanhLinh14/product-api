
name: Product API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # JOB 1: TEST CRUD
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.3
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

    env:
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/productdb_test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check server.js

      - name: Run CRUD tests
        run: npm test

  # JOB 2: HEALTHCHECK
  healthcheck:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          echo "PORT=3000" > .env
          echo "MONGO_URI=mongodb://mongodb:27017/productdb" >> .env
          echo "MONGO_URI_TEST=mongodb://127.0.0.1:27018/productdb_test" >> .env

      - name: Start Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Check container status
        run: docker compose ps

      - name: Check MongoDB health
        run: |
          STATUS=$(docker inspect --format='{{.State.Health.Status}}' nammongodb)
          echo "MongoDB health: $STATUS"
          test "$STATUS" = "healthy"

      - name: Check Product API health
        run: |
          STATUS=$(docker inspect --format='{{.State.Health.Status}}' product-api-container)
          echo "Product API health: $STATUS"
          test "$STATUS" = "healthy"

      - name: Test health endpoint
        run: curl --fail --retry 5 --retry-delay 3 http://localhost:3000/health

      - name: Show logs if failed
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop containers
        if: always()
        run: docker compose down

  # JOB 3: DOCKER HUB
  docker:
    needs:
      - test
      - healthcheck

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_DOCKER_PUBLISH == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}

  # JOB 4: DEPLOY LOCAL
  deploy-local:
    needs: docker

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_LOCAL_DEPLOY == 'true'

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull latest image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker pull "${env:DOCKERHUB_USERNAME}/product-api:latest"

      - name: Stop old production containers
        run: docker compose -f docker-compose-prod.yaml down

      - name: Start production containers
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Check production containers
        run: docker compose -f docker-compose-prod.yaml ps

      - name: Wait for Product API
        shell: powershell
        run: Start-Sleep -Seconds 15

      - name: Check Product API health
        shell: powershell
        run: |
          $status = docker inspect --format='{{.State.Health.Status}}' product-api-prod

          Write-Host "Product API health: $status"

          if ($status -ne "healthy") {
            docker logs product-api-prod
            exit 1
          }

      - name: Test health endpoint
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://localhost:3000/health" `
            -UseBasicParsing

          Write-Host $response.Content

          if ($response.StatusCode -ne 200) {
            exit 1
          }
