
services:
  mongodb:
    image: mongo:8.3
    container_name: nammongodb-prod
    ports:
      - "27019:27017"
    volumes:
      - mongo-prod-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  product-api:
    image: ${DOCKERHUB_USERNAME}/product-api:latest
    container_name: product-api-prod
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-prod-data:
